services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_CARTO_API_KEY=${VITE_CARTO_API_KEY}
    networks:
      - tci-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    networks:
      - tci-network
    restart: unless-stopped

networks:
  tci-network:
    driver: bridge
